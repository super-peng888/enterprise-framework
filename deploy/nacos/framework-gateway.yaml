# framework-gateway 业务配置 —— dataId: framework-gateway.yaml, group: DEFAULT_GROUP
server:
  port: ${SERVER_PORT:8090}

spring:
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x（starter 更名 gateway-server-webflux）：
      # 配置前缀由 spring.cloud.gateway 迁移到 spring.cloud.gateway.server.webflux
      server:
        webflux:
          # 注册中心服务发现路由；lb:// 由 nacos-discovery + loadbalancer 解析实例
          routes:
            - id: framework-system
              uri: lb://framework-system
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=2
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                # 前端 vite dev server 端口 5175
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

jwt:
  # 与 framework-system 同一密钥（网关只校验不签发）；HS256 要求 >= 32 字节
  secret: ${JWT_SECRET:framework-dev-secret-key-please-change-32bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
